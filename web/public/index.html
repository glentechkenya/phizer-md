<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHIZER MD — Pairing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>PHIZER MD</h1>
    <p class="subtitle">WhatsApp Bot Pairing</p>

    <div class="status" id="status">Disconnected</div>

    <div class="qr-wrap" id="qrWrap">
      <p class="placeholder" id="placeholder">Waiting for connection...</p>
      <img id="qrImage" alt="QR code" hidden />
    </div>

    <div class="instructions">
      <h2>How to link</h2>
      <ol>
        <li>Open WhatsApp on your phone.</li>
        <li>Go to <b>Settings → Linked Devices</b>.</li>
        <li>Tap <b>Link a Device</b>.</li>
        <li>Scan the QR code above.</li>
      </ol>
    </div>

    <button id="refreshBtn">Refresh QR</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
